<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; connect-src https://license.demo.paidextension.dev; img-src 'self' data:; style-src 'self' 'unsafe-inline'; base-uri 'none'; form-action 'none'">
  <meta name="referrer" content="no-referrer">
  <meta name="robots" content="noindex, nofollow">
  <title>Shared highlights - Marker</title>
  <link rel="icon" type="image/png" href="favicon.png">
  <link rel="stylesheet" href="assets/base.css">
  <link rel="stylesheet" href="assets/home.css">
  <link rel="stylesheet" href="assets/share.css">
  <script src="assets/theme.js"></script>
  <script src="assets/site-config.js"></script>
</head>
<body>
  <div class="wrap">
    <header class="top">
      <a class="brand" href="/"><img src="icon.png" alt="" width="32" height="32">Marker</a>
      <nav aria-label="Primary">
        <a href="index.html#install">Get Marker</a>
        <a href="index.html#built">How it's built</a>
        <button id="theme-toggle" type="button" aria-pressed="false" aria-label="Switch to dark mode"><span class="sun">&#9728;</span><span class="moon">&#9790;</span></button>
      </nav>
    </header>

    <main class="share">
      <div id="share-view" aria-live="polite">
        <div class="spinner"></div>
        <p class="status">Loading highlights…</p>
      </div>
      <p class="share-foot">Published with <a href="/">Marker</a>, an open-source highlighter built on <a href="https://paidextension.dev" rel="noopener">PaidExtension</a>. Shared pages are read-only and expire after 90 days.</p>
    </main>

    <footer>
      <div>&copy; House of Arqam Ventures LLC</div>
      <div>
        <a href="privacy.html">Privacy</a>
        <a href="terms.html">Terms</a>
        <a href="support.html">Support</a>
      </div>
    </footer>
  </div>

  <script src="share.js"></script>
</body>
</html>

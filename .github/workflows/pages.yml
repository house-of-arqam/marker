name: Deploy site

# Publishes site/docs to GitHub Pages. Alternative: Settings → Pages → Deploy
# from a branch → main /site/docs, and delete this file.
on:
  push:
    branches: [main]
    paths: ['site/docs/**']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site/docs
      - id: deployment
        uses: actions/deploy-pages@v4
